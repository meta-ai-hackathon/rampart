name: Release

# Publishes Rampart to npm and Hugging Face.
#
# Triggers on a *published* GitHub Release (cut a release whose tag matches the
# version in package.json). `workflow_dispatch` runs the same pipeline but
# defaults to a dry run so you can rehearse without shipping.
#
# Required repository secrets:
#   NPM_TOKEN  — npm automation token with publish rights to @nationaldesignstudio
#   HF_TOKEN   — Hugging Face write token for nationaldesignstudio/rampart

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify and build without publishing"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify before release
    if: github.repository == 'nationaldesignstudio/rampart'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Fetch model artifacts
        run: |
          git lfs install --local
          git lfs pull --include="model/onnx/model_q4.onnx,model/tokenizer.json,model/vocab.txt" --exclude=""

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify public package
        run: bun run verify:public

      - name: Verify npm package contents
        run: npm pack --dry-run --cache /tmp/npm-cache-rampart

  npm:
    name: Publish to npm
    needs: verify
    if: github.repository == 'nationaldesignstudio/rampart'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Fetch model artifacts
        run: |
          git lfs install --local
          git lfs pull --include="model/onnx/model_q4.onnx,model/tokenizer.json,model/vocab.txt" --exclude=""

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node (npm registry auth)
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish to npm
        # prepack builds dist/, prepublishOnly re-runs verify:public.
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run — npm publish --dry-run"
            npm publish --dry-run --access restricted
          else
            npm publish --access restricted
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  huggingface:
    name: Publish to Hugging Face
    needs: verify
    if: github.repository == 'nationaldesignstudio/rampart'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Fetch model artifacts
        run: |
          git lfs install --local
          git lfs pull --include="model/onnx/model_q4.onnx,model/tokenizer.json,model/vocab.txt" --exclude=""

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hugging Face CLI
        run: pip install --upgrade "huggingface_hub[cli]"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and verify Hugging Face export
        run: bun run export:huggingface:verify

      - name: Upload to Hugging Face
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          hf repo create nationaldesignstudio/rampart --repo-type model --private --exist-ok
          hf upload nationaldesignstudio/rampart hf-export . \
            --repo-type model \
            --commit-message "Release ${{ github.event.release.tag_name || github.sha }}"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
