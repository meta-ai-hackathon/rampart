name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Rampart
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Fetch model artifacts
        run: |
          git lfs install --local
          git lfs pull --include="model/onnx/model_q4.onnx,model/tokenizer.json,model/vocab.txt" --exclude=""

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # verify:public runs the suite through bun test, whose semantics are
      # not those of the canonical vitest runner; assert on the real suite
      # as well so a vitest-only failure mode cannot hide behind bun test.
      - name: Run the vitest test suite
        run: bun run test

      - name: Verify public package
        run: bun run verify:public

      - name: Verify npm package contents
        run: npm pack --dry-run --cache /tmp/npm-cache-rampart
